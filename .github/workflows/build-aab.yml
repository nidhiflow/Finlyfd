name: Build Android AAB

# Manual run only: Actions tab -> "Build Android AAB" -> Run workflow.
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Bubblewrap
        run: |
          # Bubblewrap only accepts an SDK folder that has a tools/ or bin/ dir, so build one.
          SDK=$HOME/android-sdk
          mkdir -p $SDK/cmdline-tools $SDK/tools
          cp -r $ANDROID_HOME/cmdline-tools/latest $SDK/cmdline-tools/latest
          SM=$SDK/cmdline-tools/latest/bin/sdkmanager
          yes | $SM --sdk_root=$SDK --licenses > /dev/null || true
          $SM --sdk_root=$SDK "build-tools;36.1.0" "platforms;android-36" "platform-tools"
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$SDK\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Restore signing keystore
        working-directory: twa
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > finly-upload.keystore

      - name: Build
        working-directory: twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set +o pipefail
          # Gradle refuses to run if the runner's SDK env vars disagree with our SDK folder.
          unset ANDROID_SDK_ROOT
          export ANDROID_HOME=$HOME/android-sdk
          npx -y @bubblewrap/cli update --skipVersionUpgrade < /dev/null || true
          ls -la
          yes | npx -y @bubblewrap/cli build --skipPwaValidation 2>&1 | tee build.log || true
          if [ ! -f app-release-bundle.aab ]; then
            MSG=$(grep -v '^[[:space:]]*at ' build.log | grep -A14 -E 'cli ERROR|What went wrong' | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::$MSG"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: finly-aab
          path: twa/app-release-bundle.aab
